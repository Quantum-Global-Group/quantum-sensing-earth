dataset:
  name: Pseudo-real GeoTIFF gravity validation fixture
  source: Procedurally generated gravity-like GeoTIFF with embedded affine transform, CRS, nodata, terrain trend, correlated noise, and known anomaly objects
  date_range: "2026-05-04"
  units: mGal-like normalized anomaly units
  citation: Bundled pseudo-real GeoTIFF fixture generated by examples/generate_pseudo_real_validation.py; not an observational science product.
preprocessing:
  notes: The GeoTIFF intentionally includes one nodata pixel to exercise missing-data handling and metadata export.
mask:
  method: Companion GeoTIFF mask where nonzero pixels indicate generated anomaly support.
  provenance: Derived directly from generated anomaly object parameters.
limitations:
  - This fixture proves raster import and geospatial metadata handling, but it is not real survey data.
  - CRS, transform, bounds, nodata, and resolution are embedded in the raster for reproducibility testing.
  - Detection quality on this fixture should be treated as software validation only.
