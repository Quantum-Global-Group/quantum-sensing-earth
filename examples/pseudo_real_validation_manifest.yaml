dataset:
  name: Pseudo-real regional gravity validation fixture
  source: Procedurally generated gravity-like raster with terrain trend, correlated noise, and multiple buried Gaussian anomaly objects
  date_range: "2026-05-04"
  units: mGal-like normalized anomaly units
  crs: EPSG:32613
  resolution: 250 m pixels
  citation: Bundled pseudo-real demonstration fixture generated by examples/generate_pseudo_real_validation.py; not an observational science product.
preprocessing:
  notes: Generated with correlated background noise and terrain gradient; use detrending/normalization flags to exercise validation preprocessing.
mask:
  method: Known generated anomaly support mask where nonzero pixels indicate anomaly cores above the synthetic object threshold.
